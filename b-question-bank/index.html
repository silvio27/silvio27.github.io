<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B类题库 · 本地刷题</title>
  <link rel="stylesheet" href="styles.css?v=20261126b">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">B</span>
        <div>
          <h1>B 类题库 · 本地刷题</h1>
          <p>业余无线电操作技术能力验证 · 离线自测与错题沉淀</p>
        </div>
      </div>
      <div class="top-meta" id="topMeta"></div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav" id="nav">
          <button class="nav-item active" data-action="nav" data-view="home"><span>⌂</span> 练习首页</button>
          <button class="nav-item" data-action="nav" data-view="practice"><span>✎</span> 当前练习</button>
          <button class="nav-item" data-action="nav" data-view="wrong"><span>⚑</span> 错题库 <em id="navWrongCount">0</em></button>
          <button class="nav-item" data-action="nav" data-view="flags"><span>☆</span> 标注详解 <em id="navFlagCount">0</em></button>
          <button class="nav-item" data-action="nav" data-view="memos"><span>✎</span> 记忆标注 <em id="navMemoCount">0</em></button>
          <button class="nav-item" data-action="nav" data-view="trash"><span>⌫</span> 题目管理 <em id="navTrashCount">0</em></button>
          <button class="nav-item" data-action="nav" data-view="search"><span>⌕</span> 题目检索</button>
          <button class="nav-item" data-action="nav" data-view="stats"><span>▤</span> 学习统计</button>
        </nav>
        <div class="sidebar-card" id="quickStats"></div>
        <div class="sidebar-tip">
          <strong>快捷键</strong>
          <p>A / B / C / D 选择 · Enter 提交 · ← → 翻题</p>
          <p>所有进度保存在本机浏览器，无需联网。</p>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="mark-toolbar" id="markToolbar" hidden>
    <span class="mt-hint">选中了题干文字</span>
    <button class="mt-btn primary" data-mark-action="add">标红关键内容</button>
    <button class="mt-btn" data-mark-action="cancel">取消</button>
  </div>
  <div class="modal-mask" id="memoModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="记忆标注">
      <div class="modal-head">
        <h3>记忆标注 · 第 <span id="memoNo">—</span> 题</h3>
        <button class="modal-x" data-action="memo-close" title="关闭">×</button>
      </div>
      <div class="modal-body" id="memoBody"></div>
      <div class="modal-foot">
        <button class="btn ghost danger-text" data-action="memo-clear">清空内容</button>
        <div class="btn-row">
          <button class="btn" data-action="memo-close">取消</button>
          <button class="btn primary" data-action="memo-save">保存标注</button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="questions.js?v=20261126b"></script>
  <script src="images.js?v=20261126b"></script>
  <script src="explanations.js?v=20261126b"></script>
  <script src="app.js?v=20261126b"></script>
</body>
</html>
